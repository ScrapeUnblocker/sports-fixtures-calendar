name: Build calendars

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; keep refresh_hours in calendars.yml in step
  workflow_dispatch:
  push:
    branches: [main]
    paths: [calendars.yml, "fixtures_calendar/**", ".github/workflows/build.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build the calendars
        id: build
        env:
          SCRAPEUNBLOCKER_API_KEY: ${{ secrets.SCRAPEUNBLOCKER_API_KEY }}
        run: |
          if [ -z "$SCRAPEUNBLOCKER_API_KEY" ]; then
            echo "::notice::Add a SCRAPEUNBLOCKER_API_KEY repository secret (Settings > Secrets and variables > Actions) to build your calendars."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m fixtures_calendar build --config calendars.yml --out site
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.built == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
